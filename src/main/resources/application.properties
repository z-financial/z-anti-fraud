spring.application.name=z-anti-fraud

# Apply db/clickhouse/account_asset_movements.sql to this database before querying.
feature.clickhouse.url=${CLICKHOUSE_JDBC_URL:jdbc:clickhouse:http://localhost:8123/default}
feature.clickhouse.username=${CLICKHOUSE_USERNAME:default}
feature.clickhouse.password=${CLICKHOUSE_PASSWORD:}
feature.clickhouse.connection-timeout-ms=2000
feature.clickhouse.socket-timeout-ms=5000
feature.clickhouse.query-timeout-seconds=5
